# Render deployment configuration
# Database: SQLite under default app storage (ephemeral unless you add a disk
# or external DB later).
# Redis: Render free tier (25MB, no persistence — queue only)
#
# BEFORE WINTER 2026: upgrade ski-ai-redis to paid plan and provision
# Render Postgres Starter ($7/mo) — free Postgres expires in 90 days.
# See docs/MASTER_PLAN.md Section 8 open question 1.
#
# For durable raw/processed files and DB across deploys, attach a Render Disk
# and set PERSISTENT_DIR to its mount path in the dashboard.

services:
  - type: web
    name: ski-ai-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: honcho start -f Procfile.render
    envVars:
      - key: REDIS_URL
        fromService:
          name: ski-ai-redis
          type: redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: LOG_LEVEL
        value: INFO

  - type: redis
    name: ski-ai-redis
    plan: free
    ipAllowList: []
