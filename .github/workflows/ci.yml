name: Audit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Import check + pytest
    runs-on: ubuntu-latest

    env:
      # Repo root on PYTHONPATH so `from data.database import ...` and other
      # top-level packages (ski, features, transformations, backend) resolve
      # the same way they do in backend/Dockerfile (ENV PYTHONPATH=/app).
      PYTHONPATH: ${{ github.workspace }}
      # Headless matplotlib backend (matches backend/Dockerfile MPLBACKEND=Agg).
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to runtime.txt (3.11.0) and backend/Dockerfile (python:3.11-slim-bookworm).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-prod.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-prod.txt

      - name: data.database import check (audit Q8)
        run: |
          python -c "from data.database import init_db, insert_session, insert_run, insert_turn"

      - name: Run pytest
        run: |
          pytest -q
